[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandrun"
version = "0.2.0"
description = "Run an AI coding agent's work against tests in an isolated sandbox, with a web dashboard, REST API and pass-rate tracking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdul Raheem" }]
requires-python = ">=3.10"
keywords = ["sandbox", "testing", "docker", "ai-agents", "evaluation", "ci", "fastapi", "runner"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
sandrun = "sandrun.cli:main"

[project.urls]
Homepage = "https://github.com/BoogeyCodes/sandrun"
Issues = "https://github.com/BoogeyCodes/sandrun/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandrun = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
